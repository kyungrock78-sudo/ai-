<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정부 안내서비스 빠른찾기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <span class="eyebrow">시민용 정부 안내서비스 검색</span>
      <h1>정부 안내서비스 빠른찾기</h1>
      <p>원하는 서비스명을 검색하고 안내분야를 선택해 필요한 정보를 빠르게 확인하세요.</p>
    </header>
    <section class="controls" aria-label="서비스 검색 및 필터">
      <div class="search-group">
        <label for="searchInput">서비스명 검색</label>
        <input id="searchInput" type="search" placeholder="예: 연금, 세금, 재난, 교육" autocomplete="off" />
      </div>
      <div class="filter-group">
        <label for="categoryFilter">안내분야</label>
        <select id="categoryFilter"><option value="전체">전체</option></select>
      </div>
      <div id="resultCount" class="result-count" aria-live="polite">현재 24건</div>
    </section>
    <main>
      <section id="serviceGrid" class="service-grid" aria-live="polite"></section>
      <div id="emptyState" class="empty-state" hidden>조건에 맞는 안내서비스가 없습니다.</div>
    </main>
    <footer>※ 가상자료를 바탕으로 제작한 시민 안내용 정적 웹페이지입니다.</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
